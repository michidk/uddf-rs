# Dependency policy: permissive licences only (see AGENTS.md).

[graph]
all-features = true

[licenses]
# Permissive licences only. GPL, LGPL, AGPL and MPL are not allowed.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
